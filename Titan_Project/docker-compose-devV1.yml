# =============================================================================
# docker-compose-devV1.yml — Titan Banking  (Dev V1 — Focused Stack)
#
# Services (4 core + 3 infrastructure):
#   Infrastructure:
#     postgres                    → 5432   (titandb + notificationdb + promotiondb)
#     redis                       → 6379
#     kafka (KRaft, no Zookeeper) → 9092
#
#   Application:
#     titan-core-banking          → 8080
#     titan-notifications-service → 8084
#     titan-promotions-service    → 8083   (deposit $100 → +$2 bonus)
#     titan-spring-gateway        → 2020
#
# Quick Start:
#   docker compose -f docker-compose-devV1.yml up -d --build
#
# Stop:
#   docker compose -f docker-compose-devV1.yml down
#
# Logs:
#   docker compose -f docker-compose-devV1.yml logs -f
#
# Test the deposit promotion:
#   curl -X POST http://localhost:2020/api/v1/promotions/deposit/simulate \
#        -H "Content-Type: application/json" \
#        -d '{"transactionId":"TEST-001","type":"DEPOSIT","amount":150.00,"currency":"USD"}'
#
#   curl http://localhost:8083/promotions/deposit/status
# =============================================================================

services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    build:
      context: ./init-db
      dockerfile: Dockerfile.postgres
    platform: linux/arm64
    container_name: devV1-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "TitanDB$$ecure2026_X9z!Lp"
      POSTGRES_DB: titandb
    ports:
      - "5432:5432"
    volumes:
      - devV1_postgres_data:/var/lib/postgresql/data
      - ./init-db/01-create-databases.sql:/docker-entrypoint-initdb.d/01-create-databases.sql
      - ./init-db/02-notification-schema.sql:/docker-entrypoint-initdb.d/02-notification-schema.sql
      - ./titan-system/schema.sql:/docker-entrypoint-initdb.d/03-titan-system-schema.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d titandb"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 15

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    platform: linux/arm64
    container_name: devV1-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Kafka (KRaft mode — no Zookeeper) ─────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    platform: linux/arm64
    container_name: devV1-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092,INTERNAL://kafka:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qg"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qg"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      start_period: 40s
      retries: 15

  # ── Kafka Topic Initializer (runs once then exits) ─────────────────────────
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    platform: linux/arm64
    container_name: devV1-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Creating Kafka topics for devV1 stack..."
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic banking.transactions.completed --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic banking.accounts.created --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic banking.accounts.updated --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic banking.transactions.dlq --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic banking.notifications.dlq --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic banking.promotions.rewards --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic banking.rewards.granted --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic banking.rewards.acknowledgment --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic banking.transactions.poison --partitions 1 --replication-factor 1
        echo "✅ Kafka topics ready"
        kafka-topics --bootstrap-server kafka:29092 --list
    restart: "no"

  # ══════════════════════════════════════════════════════════════════════════
  # APPLICATION SERVICES
  # ══════════════════════════════════════════════════════════════════════════

  # ── Core Banking ───────────────────────────────────────────────────────────
  titan-core-banking:
    build:
      context: ./titan-core-banking
      dockerfile: Dockerfile
    platform: linux/arm64
    container_name: devV1-core-banking
    ports:
      - "8080:8080"
    environment:
      # ── Database ──────────────────────────────────────────────────────────
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/titandb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "TitanDB$$ecure2026_X9z!Lp"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: titandb
      DB_USERNAME: postgres
      DB_PASSWORD: "TitanDB$$ecure2026_X9z!Lp"

      # ── Kafka ─────────────────────────────────────────────────────────────
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

      # ── Redis ─────────────────────────────────────────────────────────────
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # ── Spring ────────────────────────────────────────────────────────────
      SPRING_PROFILES_ACTIVE: docker
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0.0"
      JAVA_OPTS: "-Xmx512m -Xms256m"
      ATM_CODE_EXPIRY_MINUTES: "10"

      # ── gRPC AI (disabled — not in this stack) ────────────────────────────
      AI_HOST: localhost
      AI_PORT: "50051"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5

  # ── Notifications Service ──────────────────────────────────────────────────
  titan-notifications-service:
    build:
      context: .
      dockerfile: titan-notifications-service/Dockerfile
    container_name: devV1-notifications-service
    ports:
      - "8084:8084"
    environment:
      # ── Database ──────────────────────────────────────────────────────────
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notificationdb
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: notificationdb
      DB_USERNAME: postgres
      DB_PASSWORD: "TitanDB$$ecure2026_X9z!Lp"

      # ── Kafka ─────────────────────────────────────────────────────────────
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_ENABLED: "true"

      # ── Redis ─────────────────────────────────────────────────────────────
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # ── Spring ────────────────────────────────────────────────────────────
      SPRING_PROFILES_ACTIVE: docker
      JAVA_OPTS: "-Xmx384m -Xms192m"
      SPRING_CLOUD_VAULT_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      titan-core-banking:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8084/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5

  # ── Promotions Service (Deposit $100 → +$2 Bonus) ─────────────────────────
  titan-promotions-service:
    build:
      context: ./titan-promotions-service
      dockerfile: Dockerfile
    platform: linux/arm64
    container_name: devV1-promotions-service
    ports:
      - "8083:8083"
    environment:
      # ── Database ──────────────────────────────────────────────────────────
      DATABASE_URL: jdbc:postgresql://postgres:5432/promotiondb
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: "TitanDB$$ecure2026_X9z!Lp"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/promotiondb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "TitanDB$$ecure2026_X9z!Lp"

      # ── Kafka ─────────────────────────────────────────────────────────────
      SPRING_KAFKA_BOOTSTRAPSERVERS: kafka:29092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

      # ── Redis ─────────────────────────────────────────────────────────────
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      # ── Neo4j (disabled — not in this stack) ──────────────────────────────
      SPRING_NEO4J_URI: bolt://localhost:7687
      SPRING_NEO4J_AUTHENTICATION_USERNAME: neo4j
      SPRING_NEO4J_AUTHENTICATION_PASSWORD: password

      # ── Downstream services ───────────────────────────────────────────────
      CORE_BANKING_GRPC_HOST: titan-core-banking
      CORE_BANKING_GRPC_PORT: 9090
      AI_SERVICE_HOST: localhost
      AI_SERVICE_PORT: 50051
      AI_SERVICE_URL: http://localhost:8085

      # ── Spring ────────────────────────────────────────────────────────────
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CLOUD_VAULT_ENABLED: "false"
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0.0"
      JAVA_OPTS: "-Xmx512m -Xms256m"

      # ── Flyway ────────────────────────────────────────────────────────────
      # Allows Flyway to run migrations on a pre-existing schema and skip validation
      # (safe for local dev — V1–V9 will all be applied automatically on startup)
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_VALIDATE_ON_MIGRATE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      titan-core-banking:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 150s
      retries: 5

  # ── Go API Gateway (main door — all traffic enters here) ──────────────────
  # titan-gateway-go is the single entry point for all clients.
  # It handles: JWT auth, sliding-window rate limiting, CORS, request logging,
  # and reverse-proxies to every downstream service.
  #
  # Route overview:
  #   /api/v1/auth/**             → titan-core-banking:8080  (public)
  #   /api/auth/otp/**            → titan-core-banking:8080  (public)
  #   /api/v1/accounts/**         → titan-core-banking:8080
  #   /api/v1/transactions/**     → titan-core-banking:8080
  #   /api/v1/atm/**              → titan-core-banking:8080
  #   /api/v1/qr/**               → titan-core-banking:8080
  #   /api/v1/users/**            → titan-core-banking:8080
  #   /api/v1/loans/**            → titan-loans-service:8085  (direct, not via core)
  #   /api/v1/promotions/**       → titan-promotions-service:8083
  #   /promotions/**              → titan-promotions-service:8083
  #   /api/notify/**              → titan-notifications-service:8084
  #   /api/audit/**               → titan-notifications-service:8084
  #   /api/preferences/**         → titan-notifications-service:8084
  #   /graphql, /graphiql         → titan-promotions-service:8083
  #   /health                     → gateway itself (liveness probe)
  #   /routes                     → gateway itself (route table)
  titan-gateway-go:
    build:
      context: ./titan-gateway-go
      dockerfile: Dockerfile
    platform: linux/arm64
    container_name: devV1-gateway-go
    ports:
      - "8088:8088"
    environment:
      CONFIG_PATH: /app/config.yaml
    volumes:
      - ./titan-gateway-go/config.yaml:/app/config.yaml:ro
    depends_on:
      titan-core-banking:
        condition: service_healthy
      titan-notifications-service:
        condition: service_healthy
      titan-promotions-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8088/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5

  # ── Spring Gateway (GraphQL supergraph — internal only) ───────────────────
  # Provides the GraphQL federated schema and GraphiQL IDE on port 2020.
  # Not the main client-facing door — titan-gateway-go proxies /graphql here.
  titan-spring-gateway:
    build:
      context: ./titan-spring-gateway
      dockerfile: Dockerfile
    platform: linux/arm64
    container_name: devV1-spring-gateway
    ports:
      - "2020:2020"
    environment:
      REDIS_HOST: redis
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: "5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437"
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0.0"
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      titan-core-banking:
        condition: service_healthy
      titan-promotions-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:2020/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5

  # ── Titan AI Risk Engine (gRPC :50051 + HTTP report API :8085) ───────────────
  # Dual-mode service:
  #   • gRPC  CheckRisk — evaluated by titan-core-banking / titan-promotions-service
  #   • HTTP  FastAPI   — report dashboard, stats, blocked-transfer audit log
  #
  # High-value transfer rule: transfer >= $10,000 → BLOCKED and persisted to titan_systemdb
  #
  # Report endpoints:
  #   GET  http://localhost:8085/health
  #   GET  http://localhost:8085/api/reports/risk
  #   GET  http://localhost:8085/api/reports/blocked
  #   GET  http://localhost:8085/api/reports/stats
  #   GET  http://localhost:8085/api/reports/stats/daily
  #   POST http://localhost:8085/api/reports/generate
  #   GET  http://localhost:8085/docs
  titan-ai-service:
    build:
      context: ./titan-ai-service
      dockerfile: Dockerfile
    platform: linux/arm64
    container_name: devV1-ai-service
    ports:
      - "50051:50051"   # gRPC
      - "8085:8085"     # HTTP report API
    environment:
      GRPC_PORT: "50051"
      HTTP_PORT: "8085"
      MAX_WORKERS: "10"
      LOG_LEVEL: "INFO"

      # ── Risk thresholds ───────────────────────────────────────────────────
      RISK_LOW_MAX_AMOUNT: "1000"
      RISK_BLOCK_THRESHOLD: "10000"      # >= $10,000 → BLOCK (high-value rule)

      # ── DB persistence ────────────────────────────────────────────────────
      DB_ENABLED: "true"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: titan_systemdb
      DB_USER: postgres
      DB_PASSWORD: "TitanDB$$ecure2026_X9z!Lp"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8085/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5

  # ── Titan System Control Panel (:8090) ────────────────────────────────────
  # Central DB control panel and reporting hub for all Titan services.
  # Reads from titan_systemdb (risk_events, blocked_transfers, transfer_reports).
  # Also probes all other Titan databases for table/row stats.
  #
  # Endpoints:
  #   GET  http://localhost:8090/health
  #   GET  http://localhost:8090/api/system/databases            ← DB dashboard
  #   GET  http://localhost:8090/api/system/databases/{db}/tables
  #   POST http://localhost:8090/api/system/snapshot
  #   GET  http://localhost:8090/api/risk/events                 ← risk monitor
  #   GET  http://localhost:8090/api/risk/events/stats
  #   GET  http://localhost:8090/api/risk/events/stats/daily
  #   GET  http://localhost:8090/api/risk/blocked                ← blocked transfers
  #   PATCH http://localhost:8090/api/risk/blocked/{id}/review   ← approve/reject
  #   GET  http://localhost:8090/api/reports/transfer            ← transfer reports
  #   POST http://localhost:8090/api/reports/transfer/generate
  #   GET  http://localhost:8090/api/logs                        ← system audit logs
  #   GET  http://localhost:8090/docs                            ← Swagger UI
  titan-system:
    build:
      context: ./titan-system
      dockerfile: Dockerfile
    platform: linux/arm64
    container_name: devV1-titan-system
    ports:
      - "8090:8090"
    environment:
      HTTP_PORT: "8090"
      LOG_LEVEL: "INFO"

      # ── Primary DB (titan_systemdb) ───────────────────────────────────────
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: titan_systemdb
      DB_USER: postgres
      DB_PASSWORD: "TitanDB$$ecure2026_X9z!Lp"
    depends_on:
      postgres:
        condition: service_healthy
      titan-ai-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8090/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5

volumes:
  devV1_postgres_data:
    name: titan_devV1_postgres_data
